<div class="details-page">
  <div class="details-card">
    <div class="details-header">
      <div>
        <h2>Employee Details</h2>
        <p>View employee information</p>
      </div>
      <span class="employee-id">ID: {{ employeeObj.id }}</span>
    </div>

    <div class="details-grid">
      <div class="detail-item">
        <span>Name</span>
        <strong>{{ employeeObj.ename }}</strong>
      </div>
      <div class="detail-item">
        <span>Email</span>
        <strong>{{ employeeObj.email }}</strong>
      </div>
      <div class="detail-item">
        <span>Mobile</span>
        <strong>{{ employeeObj.mobile }}</strong>
      </div>
      <div class="detail-item">
        <span>Designation</span>
        <strong>{{ employeeObj.designation }}</strong>
      </div>
      <div class="detail-item">
        <span>Username</span>
        <strong>{{ employeeObj.username }}</strong>
      </div>
      <div class="detail-item">
        <span>Password</span>
        <strong>••••••••</strong>
      </div>
    </div>

    <div class="details-actions">
      <button class="btn btn-primary" type="button" (click)="getback()">Go Back</button>
    </div>
  </div>
</div>
