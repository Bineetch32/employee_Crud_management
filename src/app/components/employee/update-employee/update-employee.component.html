<p>Update Employee</p>
<form [formGroup]="updateForm" (ngSubmit)="onSubmit()">
  <div class="jumbotron" style="text-align:center">
    <h5 style="text-align: center; color: darkviolet;">! Update Here !</h5>
    <table class="table table-dark center" style="text-align:center">
      <tr>
        <td>Name</td>
        <td><input type="text" formControlName="ename" placeholder="Enter name"></td>
      </tr>
      <tr>
        <td>Email</td>
        <td><input type="email" formControlName="email" placeholder="Enter email"></td>
      </tr>
      <tr>
        <td>Mobile</td>
        <td><input type="text" formControlName="mobile" placeholder="Enter mobile no"></td>
      </tr>
      <tr>
        <td>Designation</td>
        <td><input type="text" formControlName="designation" placeholder="Enter designation"></td>
      </tr>
      <tr>
        <td>Username</td>
        <td><input type="text" formControlName="username" placeholder="Enter username"></td>
      </tr>
      <tr>
        <td>Password</td>
        <td><input type="password" formControlName="password" placeholder="Enter password"></td>
      </tr>
    </table>
    <button class="btn btn-primary" type="submit">Update</button>
    &nbsp;&nbsp;
    <button class="btn btn-primary" type="button" (click)="goBack()">Back</button>
  </div>
</form>
