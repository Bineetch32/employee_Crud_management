<div class="update-page">
  <div class="update-card">
    <div class="update-header">
      <div>
        <h2>Update Employee</h2>
        <p>Edit employee information and save the changes.</p>
      </div>
    </div>

    <form [formGroup]="updateForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div class="form-group">
          <label for="ename">Name</label>
          <input id="ename" type="text" formControlName="ename" placeholder="Enter name">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" placeholder="Enter email">
        </div>

        <div class="form-group">
          <label for="mobile">Mobile</label>
          <input id="mobile" type="text" formControlName="mobile" placeholder="Enter mobile number">
        </div>

        <div class="form-group">
          <label for="designation">Designation</label>
          <input id="designation" type="text" formControlName="designation" placeholder="Enter designation">
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" type="text" formControlName="username" placeholder="Enter username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" formControlName="password" placeholder="Enter password">
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Save Changes</button>
        <button class="btn btn-outline-secondary" type="button" (click)="goBack()">Cancel</button>
      </div>
    </form>
  </div>
</div>
